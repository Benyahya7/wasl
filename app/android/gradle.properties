# Small VM (7.7 GB RAM): the template's -Xmx8G gets the Gradle daemon
# OOM-killed mid-build ("daemon disappeared unexpectedly", 2026-11-07).
# 3G heap + 1G metaspace leaves room for the Kotlin daemon + Flutter tool.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Egress proxy (this VM reaches the internet only through it)
systemProp.http.proxyHost=hatch-egress-proxy
systemProp.http.proxyPort=3128
systemProp.https.proxyHost=hatch-egress-proxy
systemProp.https.proxyPort=3128
systemProp.http.nonProxyHosts=localhost
systemProp.https.nonProxyHosts=localhost
